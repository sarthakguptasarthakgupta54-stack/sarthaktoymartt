<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarthak Toy Mart – Where Every Toy Brings a Smile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff8ec;--bg2:#ffffff;--card:#ffffff;--line:#f0e2c8;--text:#231a45;--mute:#6b6488;--p:#ff5a36;--y:#ffc72c;--b:#2f6bff;--v:#7c3aed;--g:#18a957;--shadow:0 10px 30px rgba(124,58,237,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b1e;--bg2:#161129;--card:#1b1535;--line:#2c2450;--text:#f6f3ff;--mute:#a9a3c8;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0b1e;--bg2:#161129;--card:#1b1535;--line:#2c2450;--text:#f6f3ff;--mute:#a9a3c8;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 Poppins,system-ui,sans-serif}
h1,h2,h3,.fd{font-family:"Baloo 2",Poppins,sans-serif;font-weight:700;line-height:1.15}
a{color:inherit;text-decoration:none}.w{max-width:1160px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:70px;gap:10px}
.brand{display:flex;align-items:center;gap:10px}.brand svg,.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.brand b{font:800 20px/1 "Baloo 2",sans-serif;display:block;letter-spacing:.5px}.brand b i{font-style:normal;color:var(--p)}.brand small{display:block;font-size:10px;letter-spacing:3px;color:var(--v);font-weight:600}
.links{display:flex;gap:20px;font-size:14px;font-weight:500;color:var(--mute)}.links a:hover{color:var(--p)}
.tools{display:flex;gap:8px;align-items:center}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:50px;border:2px solid transparent;background:linear-gradient(135deg,var(--p),#ff8a3d);color:#fff;font:600 15px Poppins,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(255,90,54,.3);transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn.o{background:transparent;color:var(--p);border-color:var(--p);box-shadow:none}.btn.wa{background:var(--g);box-shadow:0 8px 20px rgba(24,169,87,.3)}.btn.s{padding:9px 18px;font-size:13px}.btn.r{background:transparent;color:#d33;border-color:#d33;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{position:relative;overflow:hidden;padding:80px 0 90px;background:radial-gradient(circle at 85% 15%,rgba(255,199,44,.35),transparent 45%),radial-gradient(circle at 10% 90%,rgba(47,107,255,.2),transparent 45%),var(--bg)}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;position:relative;z-index:2}
.tag{display:inline-block;background:var(--y);color:#3a2a00;font-weight:600;font-size:13px;padding:6px 16px;border-radius:30px}
.hero h1{font-size:clamp(40px,6.5vw,72px);margin:16px 0}.hero h1 em{font-style:normal;color:var(--p)}.hero p{color:var(--mute);font-size:18px;max-width:500px;margin:0 0 26px}
.stage{position:relative;aspect-ratio:1;max-width:440px;margin:0 auto;width:100%}
.blob{position:absolute;inset:6%;border-radius:42% 58% 55% 45%/50% 45% 55% 50%;background:linear-gradient(135deg,var(--y),var(--p));box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:120px}
.blob img{width:100%;height:100%;object-fit:cover}
.fl{position:absolute;font-size:44px;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2));z-index:3}
@keyframes fl{50%{transform:translateY(-14px) rotate(8deg)}}
.cats{background:var(--bg2);border-block:1px solid var(--line)}.cats .w{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding-block:22px}
.cat{padding:10px 20px;border-radius:40px;background:var(--bg);border:1px solid var(--line);font-weight:500;font-size:14px}
section{padding:80px 0}.alt{background:var(--bg2);border-block:1px solid var(--line)}
.hd{text-align:center;margin-bottom:42px}.hd h2{font-size:clamp(30px,4.5vw,46px);margin:8px 0}.hd p{color:var(--mute);margin:0 auto;max-width:560px}
.ey{color:var(--v);font-weight:600;font-size:13px;letter-spacing:3px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:.25s;display:flex;flex-direction:column}.card:hover{transform:translateY(-6px)}
.im{position:relative;aspect-ratio:1;background:linear-gradient(135deg,#ffe9a8,#ffc0a8);display:flex;align-items:center;justify-content:center;font-size:70px}.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}.cb h3{margin:0;font-size:21px}.cb p{margin:0;color:var(--mute);font-size:14px;flex:1}.price{font:700 22px "Baloo 2";color:var(--p)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.step{text-align:center;padding:20px 12px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.step i{display:flex;width:50px;height:50px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--b));color:#fff;align-items:center;justify-content:center;font:700 22px "Baloo 2";font-style:normal}.step b{display:block}.step span{font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.box h3{margin:0 0 12px;font-size:24px}.box p{color:var(--mute);margin:8px 0}
label{display:block;font-size:13px;font-weight:500;margin-top:12px;color:var(--mute)}
input,textarea,select{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;margin-top:6px}input:focus,textarea:focus,select:focus{outline:2px solid var(--v);border-color:transparent}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.pm label{margin:0;border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--text)}.pm input{width:auto;margin:0}
.safe{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}.safe span{background:rgba(24,169,87,.12);color:var(--g);font-weight:600;font-size:13px;padding:8px 16px;border-radius:30px}
.upi{font:700 18px Poppins;color:var(--p);word-break:break-all}.qr{width:200px;max-width:100%;border-radius:16px;border:6px solid #fff;display:block;margin:14px 0;box-shadow:var(--shadow)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.rv .st{color:var(--y);font-size:18px;letter-spacing:2px}.rv p{margin:8px 0;font-style:italic}.rv b{color:var(--v)}
.skills{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.skills span{background:rgba(124,58,237,.12);color:var(--v);padding:7px 16px;border-radius:30px;font-weight:600;font-size:14px}
.pf{display:grid;grid-template-columns:.8fr 1.2fr;gap:36px;align-items:center}.ph{aspect-ratio:1;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,var(--b),var(--v));display:flex;align-items:center;justify-content:center;font-size:90px;box-shadow:var(--shadow);position:relative}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
footer{background:#1b1240;color:#e9e4ff;padding:44px 0 24px}footer .w{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}footer h4{margin:0 0 8px;color:var(--y)}footer a,footer p{display:block;margin:5px 0;color:#c9c2ee;font-size:14px}
.cp{text-align:center;margin-top:26px;padding-top:18px;border-top:1px solid #34296b;font-size:13px;color:#a9a3c8}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.adm{padding:34px 0 80px}.adm .box{margin-bottom:18px}.tabs{display:flex;gap:10px;margin:16px 0 22px;flex-wrap:wrap}.tabs .btn{box-shadow:none}
.prow{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}.prow img,.prow .pp{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#eee}
.ord{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--bg)}.ord p{margin:3px 0;color:var(--text);font-size:14px}.pill{display:inline-block;padding:2px 12px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(255,90,54,.15);color:var(--p)}.pill.u{background:rgba(47,107,255,.15);color:var(--b)}
.msg{color:var(--v);font-size:13px;min-height:20px}
@media(max-width:860px){.hero .w,.two,.pf,footer .w{grid-template-columns:1fr}.links{display:none}.steps{grid-template-columns:1fr 1fr}.hero{padding:50px 0 60px}section{padding:56px 0}.brand small{display:none}}
</style>
</head>

  h+='<div class="box"><h3>'+(draft.idx>=0?'Edit toy':'Add toy')+'</h3><label>Toy name</label><input id="pn" value="'+esc(draft.name)+'"><label>Description</label><textarea id="pd" rows="2">'+esc(draft.desc)+'</textarea><label>Price (₹)</label><input id="pp" value="'+esc(draft.price)+'"><div class="row" style="margin-top:12px"><button class="btn o s" id="pi">'+(draft.img?'Change image':'Upload toy image')+'</button><button class="btn s" id="pa">'+(draft.idx>=0?'Update':'Add toy')+'</button></div></div><div class="box"><h3>Toys ('+S.products.length+')</h3>'+(list||'<p>No toys yet.</p>')+'</div>'}
 if(tab==='settings'){h+='<div class="box"><h3>Logo &amp; Photo</h3><div class="row"><div class="brand">'+logo()+'</div><button class="btn o s" id="lg">Upload logo</button><button class="btn o s" id="ph">Upload my photo</button></div></div><div class="box"><h3>UPI</h3><label>UPI ID</label><input id="ui" value="'+esc(S.upi)+'"><label>Name</label><input id="un" value="'+esc(S.upiName)+'"><div class="row" style="margin-top:12px"><button class="btn o s" id="qr">Change QR image</button></div></div><div class="box"><h3>Reviews</h3>'+S.reviews.map(function(r,i){return '<div class="prow" style="grid-template-columns:1fr auto"><div>“'+esc(r.t)+'”<br><small>'+esc(r.n)+'</small></div><button class="btn r s" data-rd="'+i+'">Delete</button></div>'}).join('')+'<label>Customer name</label><input id="rn"><label>Review</label><textarea id="rt" rows="2"></textarea><button class="btn s" id="ra" style="margin-top:12px">Add review</button></div>'}
 h+='<div class="row"><button class="btn" id="sv">Save &amp; Publish</button><button class="btn o" id="lo">Logout</button></div><p class="msg" id="m2"></p></div>';
 root.innerHTML=h;bindTools();var $=function(i){return document.getElementById(i)};
 if(tab==='orders'&&DB){try{unsub=DB.collection('orders').onSnapshot(function(s){dbo=s.docs.map(function(d){return d.data()});var e=$('ol');if(e){e.innerHTML=ordHtml();mo()}},function(){})}catch(e){}}
 function mo(){root.querySelectorAll('[data-mo]').forEach(function(b){b.onclick=function(){S.orders=S.orders.filter(function(o){return o.id!==b.dataset.mo});admin()}})}mo();
 function sync(){if($('ui')){S.upi=$('ui').value.trim();S.upiName=$('un').value.trim()}if($('pn')){draft.name=$('pn').value;draft.desc=$('pd').value;draft.price=$('pp').value}}
 root.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){sync();tab=b.dataset.tab;admin()}});
 if($('mo'))$('mo').onclick=function(){if(!$('mn').value.trim()){mg('Enter customer name.');return}S.orders.push({id:'m'+Date.now(),ts:new Date().toISOString(),name:$('mn').value.trim(),mobile:$('mm').value.trim(),product:$('mp').value.trim(),qty:$('mq').value,address:$('ma').value.trim(),pay:$('my').value,status:'New'});admin();mg('Order added. Press Save & Publish to keep it.')};
 if($('lg')){$('lg').onclick=function(){sync();pick(function(u){S.logo=u})};$('ph').onclick=function(){sync();pick(function(u){S.photo=u})};$('qr').onclick=function(){sync();pick(function(u){S.qr=u})};
  $('ra').onclick=function(){if(!$('rt').value.trim())return;S.reviews.push({n:$('rn').value.trim()||'Customer',t:$('rt').value.trim()});sync();admin()};
  root.querySelectorAll('[data-rd]').forEach(function(b){b.onclick=function(){sync();S.reviews.splice(+b.dataset.rd,1);admin()}})}
 if($('pa')){$('pi').onclick=function(){sync();pick(function(u){draft.img=u})};
  $('pa').onclick=function(){sync();if(!draft.name.trim()){mg('Enter toy name.');return}var it={id:Date.now(),name:draft.name.trim(),desc:draft.desc.trim(),price:draft.price.trim(),img:draft.img};if(draft.idx>=0)S.products[draft.idx]=it;else S.products.push(it);draft={name:'',desc:'',price:'',img:'',idx:-1};admin();mg('Toy saved. Press Save & Publish.')};
  root.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){if(confirm('Delete this toy?')){S.products.splice(+b.dataset.del,1);admin()}}});
  root.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){var x=S.products[+b.dataset.ed];draft={name:x.name,desc:x.desc,price:x.price,img:x.img,idx:+b.dataset.ed};admin();window.scrollTo(0,0)}});
  root.querySelectorAll('[data-img]').forEach(function(b){b.onclick=function(){pick(function(u){S.products[+b.dataset.img].img=u})}})}
 $('lo').onclick=function(){authed=false;location.hash='';route()};
 $('sv').onclick=async function(){sync();mg('Publishing…');try{var a=await claude.use('artifact');if(!a){mg('Publishing works only when signed in to claude.ai as the page owner.');return}
  var c=document.documentElement.cloneNode(true);c.removeAttribute('data-theme');c.setAttribute('lang','en');c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.querySelector('#root').innerHTML='';
  await a.publish('<!doctype html>\n'+c.outerHTML)}catch(e){mg((e&&e.message)||'Could not publish.')}};
}
function route(){document.documentElement.lang=lang;if(location.hash==='#admin'){authed?admin():login()}else site()}
window.addEventListener('hashchange',function(){if(location.hash==='#admin'||document.querySelector('.adm'))route()});
route();
</script>
